            .text {
                fill: #24292f;
                font-size: 13px;
            }

            .key {
                fill: #1a7f37;
                font-size: 13px;
                font-weight: 700;
            }

            .accent {
                fill: #0969da;
                font-size: 13px;
            }

            .section {
                fill: #57606a;
                font-size: 12px;
                letter-spacing: 1px;
            }

            .header {
                fill: #0969da;
                font-size: 16px;
                font-weight: 700;
            }

            .project {
                fill: #9a6700;
                font-size: 13px;
                font-weight: 700;
            }

            .title {
                fill: #57606a;
                font-size: 12px;
            }

            .command {
                fill: #24292f;
                font-size: 13px;
            }

            .cursor {
                fill: #1a7f37;
                animation: blink 1s steps(1) infinite;
            }

            .row {
                opacity: 0;
                animation: appear .45s ease forwards;
            }

            .portrait-line {
                opacity: 0;
                animation: portraitAppear .6s ease forwards;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes portraitAppear {
                from {
                    opacity: 0;
                }

                to {
                    opacity: 1;
                }
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }

        </style>
        
